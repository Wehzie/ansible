# this playbook adds appflowy cloud as a service to an existing nginx static website
# depends on install_nginx.yaml

# install ansible
#    pip3 install ansible

# run this playbook
#   ansible-playbook -i hosts.ini install_appflowy.yaml -K
#   -K queries sudo password
#   --check runs in check mode

---
- hosts: vps_pubserv
  gather_facts: false
  become: true
  vars:
    nginx_sites_customizations_dir: /etc/nginx/sites-customizations
    appflowy_http_port: 8880
    appflowy_https_port: 4443
    appflowy_install_dir: /home/{{ ansible_ssh_user }}/appflowy
  tasks:
    - name: Gather Ansible facts as non-root user
      ansible.builtin.setup:
        gather_subset: all
      become: false

    - name: Install snapd
      ansible.builtin.apt:
        name: snapd
        state: latest
        update_cache: true

    - name: Install docker and docker-compose with snap
      community.general.snap:
        name: docker
        state: present

    - name: Git clone appflowy
      ansible.builtin.git:
        repo: https://github.com/AppFlowy-IO/AppFlowy-Cloud
        dest: "{{ appflowy_install_dir }}"
        update: yes
      become: false
      become_user: "{{ ansible_ssh_user }}"
    
    - name: Create .env from deploy.env
      ansible.builtin.copy:
        src: "{{ appflowy_install_dir }}/deploy.env"
        dest: "{{ appflowy_install_dir }}/.env"
        owner: "{{ ansible_ssh_user }}"
        group: "{{ ansible_ssh_user }}"
        mode: '0644'
        remote_src: true
      become: false
      become_user: "{{ ansible_ssh_user }}"

    - name: Configure .env (FQDN)
      ansible.builtin.lineinfile:
        path: "{{ appflowy_install_dir }}/.env"
        regexp: '^FQDN='
        line: 'FQDN=https://{{ domain_name }}/appflowy'
      become: false
      become_user: "{{ ansible_ssh_user }}"

    - name: Configure .env (NGINX_PORT)
      ansible.builtin.lineinfile:
        path: "{{ appflowy_install_dir }}/.env"
        regexp: '^NGINX_PORT='
        line: 'NGINX_PORT={{ appflowy_http_port }}'
      become: false
      become_user: "{{ ansible_ssh_user }}"

    - name: Configure .env (NGINX_PORT_SSL)
      ansible.builtin.lineinfile:
        path: "{{ appflowy_install_dir }}/.env"
        regexp: '^NGINX_TLS_PORT='
        line: 'NGINX_TLS_PORT={{ appflowy_https_port }}'
      become: false
      become_user: "{{ ansible_ssh_user }}"

    - name: Start appflowy
      community.docker.docker_compose_v2:
        project_src: "{{ appflowy_install_dir }}"
        state: present
      register: output

    - name: Show compose results
      ansible.builtin.debug:
        var: output

    - name: Add Nginx configuration for appflowy
      blockinfile:
        path: "{{ nginx_sites_customizations_dir }}/{{ domain_name }}_appflowy"
        create: true
        block: |
              underscores_in_headers on;
              
              # while we have set FQDN to https://{{ domain_name }}/appflowy
              # we need to rewrite the URL to /appflowy
              # because appflowy doesnt seem to get this right
              location /static/ {
                  proxy_pass http://127.0.0.1:{{ appflowy_http_port }}/static/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_pass_request_headers on;
              }

              location /appflowy {
                  proxy_pass http://127.0.0.1:{{ appflowy_http_port }}/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_pass_request_headers on;

                  # WebSockets support
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "Upgrade";
              }
      notify: test nginx config

  handlers:
    - name: test nginx config
      ansible.builtin.command: nginx -t
      notify: reload nginx

    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded